name: Sync plugin outputs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix plugin ci
      - run: pnpm build
      - name: Commit generated plugin outputs
        run: |
          if git diff --quiet -- .pluginpack README.md build plugin/shared; then
            echo 'Generated plugin outputs are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pluginpack README.md build plugin/shared
          git commit -m 'chore: sync generated plugin outputs [skip ci]'
          git push origin HEAD:main
