name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-registry:
    name: Validate registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # registry.json is built from recipes/<id>/recipe.json and committed,
      # since the dev site and the plugin both consume it as one file.
      - name: Check registry.json is not stale
        run: node scripts/build-registry.mjs --check
      - run: pnpm validate:registry
      - name: Report recipe verification freshness (informational)
        run: node scripts/check-recipe-freshness.mjs

  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The verify harness owns an OAuth flow; state validation and PKCE
      # derivation are not things to leave untested. No credentials needed --
      # the live-discovery test skips itself without GLEAN_INSTANCE.
      - run: pnpm test

  recipe-fixtures:
    name: Recipe fixture verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix recipes/oncall-copilot ci
      - run: npm --prefix recipes/onboarding-hub/platform-chat ci
      - run: npm --prefix recipes/rfp-responder ci
      - run: PORT=3211 npm --prefix recipes/oncall-copilot run verify:fixture
      - run: npm --prefix recipes/onboarding-hub/platform-chat run verify:context
      - run: PORT=3212 npm --prefix recipes/rfp-responder run verify:fixture
      # The trigger recipes below boot their own receivers on ports they
      # allocate themselves, so no PORT is pinned for any of them.
      - run: npm --prefix recipes/github-pr-review-monitor ci
      - run: npm --prefix recipes/github-pr-review-monitor run verify:fixture
      # Executes the shipped n8n workflow's own Code nodes; no server, no port.
      - run: npm --prefix recipes/gong-call-follow-up-n8n ci
      - run: npm --prefix recipes/gong-call-follow-up-n8n run verify:fixture
      - run: npm --prefix recipes/pre-meeting-brief ci
      - run: npm --prefix recipes/pre-meeting-brief run verify:fixture

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  snippets-check:
    name: Prose/code snippets in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm snippets:check
      - run: pnpm skill-context:check
      - run: pnpm recipe-commands:check
      - run: pnpm recipe-questions:check
      - run: pnpm mdx:check

  pinned-deps:
    name: Pinned SDK versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node-side deps (package.json, requirements.txt)
        run: node scripts/check-pinned-deps.mjs
      - name: Python-side deps (PEP 723 via uv locks)
        run: python3 scripts/check_pinned_deps.py

  plugin-build:
    name: Build & validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: plugin
        run: npm ci
      # Standalone recipe scaffolds carry generated runtime and brand assets.
      # The token sync against glean-developer-site stays manual because that
      # repository is not available here.
      - name: Check generated cookbook artifacts are not stale
        run: pnpm artifacts:check
      # Recipe PRs validate a fresh plugin render, but do not carry generated
      # plugin skills, manifests, or build output. The main-branch sync workflow
      # commits those outputs after CI succeeds on main.
      - name: Generate cookbook skills
        working-directory: plugin
        run: npm run generate:commands
      - name: Build all targets
        working-directory: plugin
        run: npx pluginpack build
      # Belt and braces on the failure mode above: a surviving `{{> name}}` in
      # build/ means a skill shipped its template instead of the partial's text,
      # which reads as valid markdown and passes every other check here. Scoped
      # to build/ -- plugin/shared/cookbook/skills/ holds the templates, where
      # these markers are correct.
      - name: No unexpanded partials in emitted plugin content
        run: |
          if grep -rn '{{>' build/; then
            echo "::error::Unexpanded pluginpack partials in build/ (above). Run 'pnpm build:plugin' and commit the result."
            exit 1
          fi
      - name: Validate all plugin targets
        working-directory: plugin
        run: npm run validate
      - name: Validate root marketplace manifest with Claude Code itself
        run: npx --yes @anthropic-ai/claude-code plugin validate .

  recipe-checks:
    name: Recipe typecheck / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Typecheck and lint every recipe
        run: |
          set -e
          shopt -s nullglob
          # examples/ too: examples/sample-catalog is real, runnable Python that
          # used to be a recipe, and dropping it from this glob would remove its
          # lint, typecheck and lock coverage without any check going red.
          recipe_dirs=(recipes/*/ examples/*/)
          if [ ${#recipe_dirs[@]} -eq 0 ]; then
            echo "No recipes yet — nothing to check."
            exit 0
          fi
          pip install ruff pyright
          for recipe in "${recipe_dirs[@]}"; do
            echo "::group::${recipe}"
            find "$recipe" -name package.json -not -path '*/node_modules/*' | while read -r pkg; do
              dir=$(dirname "$pkg")
              (cd "$dir" && npm ci)
              if [ -f "$dir/tsconfig.json" ]; then
                (cd "$dir" && npx tsc --noEmit)
              fi
              if [ -f "$dir/eslint.config.mjs" ]; then
                (cd "$dir" && npx eslint .)
              fi
            done
            find "$recipe" -name requirements.txt | while read -r req; do
              dir=$(dirname "$req")
              pip install -r "$req"
              ruff check "$dir"
              if [ -f "$dir/pyrightconfig.json" ]; then
                (cd "$dir" && pyright .)
              fi
            done
            # PEP 723 scripts declare their deps inline and have no
            # requirements.txt, so the loop above never sees them. uv builds an
            # isolated env per script; pyright needs --pythonpath pointed at it
            # (VIRTUAL_ENV is not honoured by the CLI and silently falls back
            # to the ambient interpreter, which reports a false pass).
            find "$recipe" -name '*.py' -not -path '*/.venv/*' | while read -r script; do
              grep -q '^# /// script' "$script" || continue
              dir=$(dirname "$script")
              # Fails if the committed lock no longer matches the inline
              # dependencies, so a recipe can't drift transitively.
              uv lock --script "$script" --check
              env_path=$(uv sync --script "$script" --locked 2>&1 | sed -n 's/.*script environment at: //p')
              if [ -z "$env_path" ]; then
                echo "Could not resolve a uv script environment for $script"
                exit 1
              fi
              ruff check "$dir"
              if [ -f "$dir/pyrightconfig.json" ]; then
                (cd "$dir" && pyright --pythonpath "$env_path/bin/python" .)
              fi
            done
            echo "::endgroup::"
          done
