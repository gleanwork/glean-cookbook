<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Acme Answers</title>
    <style>
      body {
        margin: 0;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f7f8fa;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 24px;
        background: #ffffff;
        border-bottom: 1px solid #e7e8ed;
      }
      .mark {
        width: 22px;
        height: 22px;
      }
      h1 {
        font-size: 16px;
        margin: 0;
        color: #1f2024;
      }
      main {
        max-width: 720px;
        margin: 32px auto;
        padding: 0 24px;
      }
      #chat {
        position: relative;
        display: block;
        width: 100%;
        height: 480px;
        background: #ffffff;
        border: 1px solid #e7e8ed;
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <header>
      <svg
        class="mark"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64"
        width="22"
        height="22"
        role="img"
        aria-label="Acme Corp"
      >
        <title>Acme Corp</title>
        <rect x="0" y="0" width="64" height="64" rx="18" fill="#0E8C84"></rect>
        <path
          fill-rule="evenodd"
          fill="#ffffff"
          d="M32 13 L55 52 L9 52 Z M32 29 L43 46 L21 46 Z"
        ></path>
      </svg>
      <h1>Acme Answers</h1>
    </header>
    <main>
      <div id="chat"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
