<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Acme Answers</title>
    <style>
      body {
        margin: 0;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f7f8fa;
        color: #1f2024;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 24px;
        background: #ffffff;
        border-bottom: 1px solid #e7e8ed;
      }
      .mark {
        width: 22px;
        height: 22px;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      main {
        max-width: 640px;
        margin: 32px auto;
        padding: 0 24px;
      }
      form {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #c9cbd2;
        border-radius: 8px;
        font-size: 14px;
      }
      button {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #0e8c84;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }
      #answer {
        margin-top: 24px;
        padding: 20px;
        background: #ffffff;
        border: 1px solid #e7e8ed;
        border-radius: 12px;
        min-height: 48px;
        white-space: pre-wrap;
      }
      #citations {
        margin-top: 12px;
        font-size: 13px;
      }
      #citations a {
        color: #0e8c84;
      }
    </style>
  </head>
  <body>
    <header>
      <svg
        class="mark"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64"
        width="22"
        height="22"
        role="img"
        aria-label="Acme Corp"
      >
        <title>Acme Corp</title>
        <rect x="0" y="0" width="64" height="64" rx="18" fill="#0E8C84"></rect>
        <path
          fill-rule="evenodd"
          fill="#ffffff"
          d="M32 13 L55 52 L9 52 Z M32 29 L43 46 L21 46 Z"
        ></path>
      </svg>
      <h1>Acme Answers</h1>
    </header>
    <main>
      <form id="ask-form">
        <input
          id="question"
          type="text"
          placeholder="What's our PTO policy?"
          autocomplete="off"
        />
        <button type="submit">Ask</button>
      </form>
      <div id="answer"></div>
      <div id="citations"></div>
    </main>
    <script type="module">
      const form = document.getElementById('ask-form');
      const answerEl = document.getElementById('answer');
      const citationsEl = document.getElementById('citations');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const question = document.getElementById('question').value.trim();
        if (!question) return;

        answerEl.textContent = 'Asking Glean…';
        citationsEl.innerHTML = '';

        const response = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await response.json();

        if (data.error) {
          answerEl.textContent = `Error: ${data.error}`;
          return;
        }

        answerEl.textContent = data.answer || '(no answer)';
        citationsEl.innerHTML = data.citations
          .map(
            (doc) =>
              `<div><a href="${doc.url}" target="_blank" rel="noreferrer">${doc.title}</a></div>`,
          )
          .join('');
      });
    </script>
  </body>
</html>
