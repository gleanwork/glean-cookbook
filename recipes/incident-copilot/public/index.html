<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incident copilot</title>
    <link rel="stylesheet" href="/glean-cookbook.css" />
    <style>
      /* Recipe-specific only. Everything else comes from the shared stylesheet. */
      h1 {
        font-size: 18px;
        letter-spacing: -0.01em;
        margin: 0 0 4px;
      }
      .split {
        grid-template-columns: 320px 1fr;
        gap: 18px;
        align-items: start;
      }
      /* Evidence roles, answer confidence and incident status are this recipe's
         own vocabulary, so their colours live here; .pill supplies the shape. */
      .pill.precedent,
      .pill.supported {
        background: var(--gdt-success-bg);
        color: var(--gdt-success-fg);
      }
      .pill.procedure {
        background: var(--gdt-selected-bg);
        color: var(--gdt-info-fg);
      }
      .pill.context {
        background: var(--gdt-bg-light);
        color: var(--gdt-text-secondary);
        border: 1px solid var(--gdt-border-light);
      }
      .pill.weak {
        background: var(--gdt-warning-bg);
        color: var(--gdt-warning-fg);
        border: 1px solid var(--gdt-warning-border);
      }
      .st-acknowledged,
      .st-awaiting-approval {
        background: var(--gdt-warning-bg);
        color: var(--gdt-warning-fg);
      }
      .st-executed,
      .st-approved,
      .st-resolved {
        background: var(--gdt-success-bg);
        color: var(--gdt-success-fg);
      }
      .st-escalated,
      .st-action-failed,
      .st-rejected {
        background: var(--gdt-danger-bg);
        color: var(--gdt-danger-fg);
      }
      /* Selectable incident in the on-call queue. */
      .q {
        border: 1px solid var(--gdt-border-light);
        border-radius: var(--glean-border-radius-md);
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .q:hover {
        background: var(--gdt-bg-light);
      }
      .q.sel {
        border-color: var(--gdt-primary);
        background: var(--gdt-selected-bg);
      }
      .q .id {
        font-family: var(--font-jetbrains-mono);
        font-size: 12px;
        color: var(--gdt-text-secondary);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Incident copilot</h1>
      <div class="subtitle" id="banner"></div>
    </header>
    <main class="layout">
      <section class="card">
        <h2 class="section-label">Fire an alarm</h2>
        <div class="actions">
          <select id="orchestrator" style="width: 300px"></select>
          <button id="fire" class="btn-primary">
            PagerDuty webhook → PAY-2231 (canary)
          </button>
          <button id="fire-novel">PAY-2232 (no precedent)</button>
          <button id="reset">Reset</button>
        </div>
        <div class="muted" style="margin-top: 8px" id="filter-note"></div>
      </section>

      <div class="grid split">
        <div>
          <section class="card">
            <h2 class="section-label">On-call queue</h2>
            <div id="queue"><div class="muted">No incidents yet.</div></div>
          </section>
        </div>
        <div id="detail"></div>
      </div>
    </main>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      let state = { incidents: [], selected: null, config: null };

      const el = (tag, props = {}, kids = []) => {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(props)) {
          if (k === 'class') n.className = v;
          else if (k === 'text') n.textContent = v;
          else if (k === 'value') n.value = v;
          else n.setAttribute(k, v);
        }
        for (const c of kids) n.append(c);
        return n;
      };

      function safeLink(title, url) {
        let u;
        try {
          u = new URL(url);
        } catch {
          return el('span', { text: title });
        }
        if (u.protocol !== 'https:' && u.protocol !== 'http:')
          return el('span', { text: title });
        return el('a', {
          href: u.href,
          target: '_blank',
          rel: 'noreferrer noopener',
          text: title,
        });
      }

      async function boot() {
        state.config = await (await fetch('/api/config')).json();
        const c = state.config;
        $('banner').textContent =
          `Signed in as ${c.actor}. Default approval expiry ${Math.round(c.defaultExpiryMs / 60000)} min ` +
          `(per-service, from the catalog). ` +
          (c.fixtureMode
            ? 'Fixture mode — no credentials, no network.'
            : 'Live mode.');
        $('orchestrator').replaceChildren(
          ...c.orchestrators.map((o) =>
            el('option', {
              value: o.id,
              text: o.available
                ? o.label
                : `${o.label} — unavailable (set GLEAN_AGENT_ID)`,
              ...(o.available ? {} : { disabled: 'disabled' }),
            }),
          ),
        );
        $('filter-note').textContent =
          'Actions available for approval: ' +
          c.actions.map((a) => a.id).join(', ') +
          '. Nothing outside that list can execute.';
        await refresh();
      }

      async function fire(file) {
        const alarm = await (await fetch(`/api/sample-alarm${file}`)).json();
        const o = $('orchestrator').value;
        const res = await fetch(`/webhook/pagerduty?orchestrator=${o}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(alarm),
        });
        const body = await res.json();
        if (body.filtered) {
          alert(`Filtered: ${body.reason}`);
          return;
        }
        state.selected = body.incident?.id ?? null;
        await refresh();
      }

      $('fire').addEventListener('click', () => fire(''));
      $('fire-novel').addEventListener('click', async () => {
        // Second fixture alarm: same service, a failure with no precedent.
        const alarm = {
          id: 'PAY-2232',
          service: 'payments-service',
          kind: 'saturation',
          metric: 'ledger write queue depth',
          summary:
            'Ledger write queue depth growing unbounded; no deploy in flight',
          severity: 'Sev2',
          firedAt: new Date().toISOString(),
        };
        const o = $('orchestrator').value;
        const res = await fetch(`/webhook/pagerduty?orchestrator=${o}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(alarm),
        });
        const body = await res.json();
        state.selected = body.incident?.id ?? null;
        await refresh();
      });
      $('reset').addEventListener('click', async () => {
        await fetch('/api/reset', { method: 'POST' });
        state.selected = null;
        await refresh();
      });

      async function refresh() {
        const data = await (await fetch('/api/incidents')).json();
        state.incidents = data.incidents;
        state.approvers = data.approvers;
        renderQueue();
        renderDetail();
      }

      function renderQueue() {
        const q = $('queue');
        if (state.incidents.length === 0) {
          q.replaceChildren(
            el('div', { class: 'muted', text: 'No incidents yet.' }),
          );
          return;
        }
        q.replaceChildren(
          ...state.incidents.map((inc) => {
            const card = el(
              'div',
              { class: `q${inc.id === state.selected ? ' sel' : ''}` },
              [
                el('div', {
                  class: 'id',
                  text: `${inc.id} · ${inc.service.service}`,
                }),
                el('div', {
                  text:
                    inc.alarm.summary.slice(0, 70) +
                    (inc.alarm.summary.length > 70 ? '…' : ''),
                }),
                el('div', { class: 'actions', style: 'margin-top:6px' }, [
                  el('span', {
                    class: `pill st-${inc.status}`,
                    text: inc.status,
                  }),
                  el('span', {
                    class: 'muted',
                    text:
                      inc.orchestrator === 'agent'
                        ? 'agent-planned'
                        : 'app-planned',
                  }),
                ]),
              ],
            );
            card.addEventListener('click', () => {
              state.selected = inc.id;
              renderQueue();
              renderDetail();
            });
            return card;
          }),
        );
      }

      function renderDetail() {
        const host = $('detail');
        const inc = state.incidents.find((i) => i.id === state.selected);
        if (!inc) {
          host.replaceChildren();
          return;
        }
        const meta = state.approvers.find((a) => a.id === inc.id);
        host.replaceChildren(
          triageCard(inc, meta),
          evidenceCard(inc),
          approvalCard(inc, meta),
          channelCard(inc),
          auditCard(inc),
        );
      }

      function triageCard(inc) {
        const supported = inc.hypotheses.filter(
          (h) => h.confidence === 'supported',
        );
        const kids = [
          el('h2', { class: 'section-label', text: 'Triage card' }),
        ];

        if (supported.length === 0) {
          kids.push(
            el('div', {
              class: 'note',
              text:
                'No probable cause asserted. No past incident matches this alarm signature, ' +
                'so naming a cause here would be a guess. Runbooks retrieved highly, but a runbook is procedure — it records what to do, not why this broke.',
            }),
          );
        }

        kids.push(
          el('table', {}, [
            el('tbody', {}, [
              tr('Alarm', `${inc.alarm.summary} (${inc.alarm.severity})`),
              tr(
                'Service',
                `${inc.service.service} · ${inc.service.tier} · deps: ${inc.service.dependencies.join(', ')}`,
              ),
              tr('On call', inc.service.onCall),
              tr('Owner', inc.service.techLead),
              tr(
                'Planner',
                inc.orchestrator === 'agent'
                  ? 'Glean agent (Agent API)'
                  : 'App-orchestrated',
              ),
            ]),
          ]),
        );

        if (inc.hypotheses.length > 0) {
          kids.push(
            el('h2', {
              style: 'margin-top:16px',
              text: 'Probable cause, ranked by evidence',
            }),
          );
          for (const h of inc.hypotheses) {
            kids.push(
              el('div', { style: 'margin-bottom:10px' }, [
                el('div', { class: 'actions' }, [
                  el('span', {
                    class: `pill ${h.confidence}`,
                    text: h.confidence,
                  }),
                  el('strong', { text: h.cause }),
                ]),
                el('div', { class: 'muted', text: h.reason }),
                el(
                  'div',
                  { class: 'muted' },
                  h.evidence.flatMap((e, i) =>
                    i === 0
                      ? [safeLink(e.title, e.url)]
                      : [
                          document.createTextNode(', '),
                          safeLink(e.title, e.url),
                        ],
                  ),
                ),
              ]),
            );
          }
        }
        return el('section', { class: 'card' }, kids);
      }

      function tr(k, v) {
        return el('tr', {}, [
          el('th', { style: 'width:120px', text: k }),
          el('td', { text: v }),
        ]);
      }

      function evidenceCard(inc) {
        return el('section', { class: 'card' }, [
          el('h2', {
            class: 'section-label',
            text: 'Evidence, by what it can prove',
          }),
          el('div', {
            class: 'muted',
            style: 'margin-bottom:10px',
            text: 'precedent = a past incident with a matching signature, the only thing that can support a cause. procedure = a runbook; supports an action, never a cause. context = ownership and topology.',
          }),
          el('table', {}, [
            el('thead', {}, [
              el('tr', {}, [
                el('th', { text: 'Role' }),
                el('th', { text: 'Signature' }),
                el('th', { text: 'Document' }),
              ]),
            ]),
            el(
              'tbody',
              {},
              inc.evidence
                .slice()
                .sort((a, b) => b.signatureMatch - a.signatureMatch)
                .map((e) =>
                  el('tr', {}, [
                    el('td', {}, [
                      el('span', { class: `pill ${e.role}`, text: e.role }),
                    ]),
                    el('td', { text: e.signatureMatch.toFixed(2) }),
                    el('td', {}, [safeLink(e.title, e.url)]),
                  ]),
                ),
            ),
          ]),
        ]);
      }

      function approvalCard(inc, meta) {
        const kids = [
          el('h2', { class: 'section-label', text: 'Approval gate' }),
        ];

        if (!inc.proposed) {
          kids.push(
            el('div', {
              class: 'note note-danger',
              text: 'No action was offered. The planner named an action that is not pre-registered, so it was refused and audited rather than shown to you.',
            }),
          );
          return el('section', { class: 'card' }, kids);
        }

        const action = state.config.actions.find(
          (a) => a.id === inc.proposed.actionId,
        );
        kids.push(
          el('div', {
            class: 'note note-info',
            text: `${action ? action.label : inc.proposed.actionId} — ${action ? action.effect : 'unregistered'}`,
          }),
        );

        if (inc.status === 'awaiting-approval') {
          kids.push(
            el('div', {
              class: 'muted',
              text: `Expires ${inc.expiresAt}. On expiry this escalates to ${inc.service.escalateTo} and does NOT execute.`,
            }),
          );
        }

        const summary = el('input', { value: inc.proposed.summary });
        const detail = el('textarea', {}, [
          document.createTextNode(inc.proposed.detail),
        ]);
        const terminal = [
          'executed',
          'action-failed',
          'rejected',
          'escalated',
          'resolved',
        ].includes(inc.status);
        if (terminal) {
          summary.setAttribute('disabled', 'disabled');
          detail.setAttribute('disabled', 'disabled');
        }

        kids.push(el('div', { style: 'margin:10px 0 6px' }, [summary]));
        kids.push(detail);
        if (inc.proposed.basis) {
          kids.push(
            el('div', { class: 'muted', style: 'margin-top:6px' }, [
              document.createTextNode('Licensed by runbook: '),
              safeLink(inc.proposed.basis.title, inc.proposed.basis.url),
            ]),
          );
        }

        if (!meta?.youMayApprove) {
          kids.push(
            el('div', {
              class: 'note note-danger',
              style: 'margin-top:10px',
              text: `You (${state.config.actor}) may not approve this. Restricted to ${meta ? meta.allowed.join(' or ') : 'the service owners'}. Set INCIDENT_ACTOR to one of them.`,
            }),
          );
        }

        const approve = el('button', {
          class: 'btn-primary btn-sm',
          text: 'Approve & execute',
        });
        const rejectBtn = el('button', { class: 'btn-sm', text: 'Reject' });
        const expire = el('button', {
          class: 'btn-danger btn-sm',
          text: 'Force expiry → escalate',
        });
        if (terminal || !meta?.youMayApprove) {
          approve.disabled = true;
          rejectBtn.disabled = true;
        }
        if (inc.status !== 'awaiting-approval') expire.disabled = true;

        approve.addEventListener('click', async () => {
          const res = await fetch('/api/approve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              id: inc.id,
              summary: summary.value,
              detail: detail.value,
            }),
          });
          if (!res.ok) alert((await res.json()).error);
          await refresh();
        });
        rejectBtn.addEventListener('click', async () => {
          const why =
            prompt('Why are you rejecting this?') ?? 'no reason given';
          const res = await fetch('/api/reject', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: inc.id, why }),
          });
          if (!res.ok) alert((await res.json()).error);
          await refresh();
        });
        expire.addEventListener('click', async () => {
          await fetch('/api/force-expiry', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: inc.id }),
          });
          await refresh();
        });

        kids.push(
          el('div', { class: 'actions', style: 'margin-top:12px' }, [
            approve,
            rejectBtn,
            expire,
          ]),
        );

        if (inc.executionOutput) {
          kids.push(
            el('div', {
              class: `note ${inc.status === 'action-failed' ? 'bad' : 'info'}`,
              style: 'margin-top:12px',
              text: inc.executionOutput,
            }),
          );
        }

        if (
          ['executed', 'action-failed', 'rejected', 'escalated'].includes(
            inc.status,
          )
        ) {
          const pm = el('button', {
            class: 'btn-sm',
            text: 'Draft postmortem timeline',
          });
          pm.addEventListener('click', async () => {
            await fetch('/api/postmortem', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: inc.id }),
            });
            await refresh();
          });
          kids.push(
            el('div', { class: 'actions', style: 'margin-top:10px' }, [pm]),
          );
        }
        if (inc.postmortem) kids.push(el('pre', { text: inc.postmortem }));

        return el('section', { class: 'card' }, kids);
      }

      function channelCard(inc) {
        return el('section', { class: 'card' }, [
          el('h2', { class: 'section-label', text: '#eng-oncall' }),
          el(
            'ul',
            { class: 'log' },
            inc.channel.map((p) =>
              el('li', { text: `${p.at}  [${p.kind}] ${p.text}` }),
            ),
          ),
        ]);
      }

      function auditCard(inc) {
        const host = el('section', { class: 'card' }, [
          el('h2', { class: 'section-label', text: 'Audit log' }),
        ]);
        fetch(`/api/audit?id=${encodeURIComponent(inc.id)}`)
          .then((r) => r.json())
          .then((entries) => {
            host.append(
              el(
                'ul',
                { class: 'log' },
                entries.map((e) =>
                  el('li', {
                    text: `${e.at}  ${e.actor} ${e.outcome} ${e.action}${e.detail ? ` — ${e.detail}` : ''}`,
                  }),
                ),
              ),
            );
          });
        return host;
      }

      boot();
    </script>
  </body>
</html>
