<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account Journey</title>
    <style>
      :root {
        --primary: #343ced;
        --text-primary: #1f2024;
        --text-secondary: #565a64;
        --bg-light: #f7f8fa;
        --border-light: #e7e8ed;
        --card-bg: #ffffff;
        --warning-bg: #fff8e5;
        --font:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font);
        background: var(--bg-light);
        color: var(--text-primary);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 24px;
        background: #fff;
        border-bottom: 1px solid var(--border-light);
      }
      .mark {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      .subtitle {
        color: var(--text-secondary);
        font-size: 13px;
      }
      .path-badge {
        margin-left: auto;
        font-size: 12px;
        color: var(--text-secondary);
        border: 1px solid var(--border-light);
        border-radius: 999px;
        padding: 4px 10px;
      }
      main {
        max-width: 1100px;
        margin: 24px auto;
        padding: 0 24px 48px;
        display: grid;
        gap: 20px;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border-light);
        border-radius: 12px;
        padding: 20px;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }
      @media (max-width: 800px) {
        .kpi-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .kpi dt {
        font-size: 12px;
        color: var(--text-secondary);
        margin: 0 0 4px;
      }
      .kpi dd {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      .kpi-note {
        margin-top: 12px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      @media (max-width: 900px) {
        .tiles {
          grid-template-columns: 1fr;
        }
      }
      .tile h3 {
        margin: 0 0 12px;
        font-size: 14px;
      }
      .hit {
        border-top: 1px solid var(--border-light);
        padding-top: 10px;
        margin-top: 10px;
      }
      .hit a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        font-size: 13px;
      }
      .hit p {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .empty {
        background: var(--warning-bg);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      button,
      .actions button {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 8px 14px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: var(--text-primary);
        border: 1px solid var(--border-light);
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #journey-answer,
      #chat-answer {
        white-space: pre-wrap;
        font-size: 14px;
        line-height: 1.5;
        min-height: 1.5em;
      }
      .citations {
        margin-top: 12px;
        display: grid;
        gap: 6px;
      }
      .citations a {
        font-size: 12px;
        color: var(--primary);
      }
      .chat-row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .chat-row input {
        flex: 1;
        border: 1px solid var(--border-light);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
      }
      .error {
        color: #b42318;
        font-size: 13px;
        margin-top: 8px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <svg
        class="mark"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 32 32"
        width="28"
        height="28"
        role="img"
        aria-label="Glean"
      >
        <title>Glean</title>
        <path
          d="M24.3006 2.95427L20.7656 0.199951L17.9028 3.99527C13.5653 1.93495 8.23019 3.08439 5.19394 7.00983C1.65888 11.5642 2.483 18.1138 7.03738 21.6489C8.77238 22.9935 10.7893 23.7092 12.8279 23.8177C16.1461 24.0128 19.5077 22.6248 21.6765 19.8055C24.7344 15.88 24.5175 10.4148 21.4596 6.72789L24.3006 2.95427ZM18.1197 17.0512C16.1028 19.632 12.3725 20.1091 9.77001 18.0922C7.18919 16.0752 6.71207 12.3233 8.72901 9.74246C9.70494 8.48458 11.1146 7.68214 12.6761 7.48696C13.0448 7.44358 13.4135 7.4219 13.7822 7.44358C14.975 7.50865 16.1244 7.94239 17.0787 8.67977C19.6595 10.7184 20.1366 14.4703 18.1197 17.0512Z"
          fill="#4718F2"
        ></path>
        <path
          d="M24.5176 21.6922C23.932 22.4513 23.2814 23.1236 22.5657 23.7525C21.8717 24.3381 21.1127 24.8803 20.3102 25.3357C19.5295 25.7695 18.6837 26.1382 17.8378 26.4201C16.992 26.702 16.1028 26.8972 15.2137 27.0057C14.3245 27.1141 13.4353 27.1575 12.5244 27.0924C11.6135 27.0273 10.7243 26.8755 9.85684 26.6587L9.66165 27.3743L8.77246 30.9962C9.90021 31.2998 11.0497 31.4733 12.2208 31.56C12.2642 31.56 12.3292 31.56 12.3726 31.56C13.5003 31.6251 14.6498 31.5817 15.7558 31.4516C16.927 31.2998 18.0981 31.0395 19.2258 30.6708C20.3536 30.3022 21.4597 29.825 22.5007 29.2395C23.5634 28.6539 24.561 27.9382 25.4935 27.1575C26.4478 26.355 27.3153 25.4442 28.0744 24.4465C28.1828 24.3164 28.2695 24.1646 28.378 24.0128L24.7779 21.3452C24.6694 21.4537 24.6044 21.5838 24.5176 21.6922Z"
          fill="#4718F2"
        ></path>
      </svg>
      <div>
        <h1>Account Journey</h1>
        <div class="subtitle" data-account-subtitle></div>
      </div>
    </header>
    <main>
      <section class="card" id="kpi-card">
        <h2 data-account-name></h2>
        <div class="kpi-grid" id="kpi-grid"></div>
        <p class="kpi-note" id="kpi-note"></p>
      </section>

      <section class="tiles" id="tiles"></section>

      <section class="card">
        <h2>Journey summary</h2>
        <div class="actions">
          <button type="button" data-prompt="Give me a customer summary">
            Customer summary
          </button>
          <button
            type="button"
            class="secondary"
            data-prompt="What are the renewal risks?"
          >
            Renewal risks
          </button>
          <button
            type="button"
            class="secondary"
            data-prompt="What's the status of our renewal with that account?"
          >
            Renewal status
          </button>
        </div>
        <div id="journey-answer">Loading journey summary…</div>
        <div class="citations" id="journey-citations"></div>
        <div class="error" id="journey-error" hidden></div>
      </section>

      <section class="card">
        <h2>Ask about this account</h2>
        <div id="chat-answer"></div>
        <div class="citations" id="chat-citations"></div>
        <div class="chat-row">
          <input
            id="chat-input"
            type="text"
            placeholder="Ask a follow-up about this account…"
            value="What's the status of our renewal with that account?"
          />
          <button type="button" id="chat-send">Ask</button>
        </div>
        <div class="error" id="chat-error" hidden></div>
      </section>
    </main>

    <script>
      function safeUrl(url) {
        try {
          const parsed = new URL(url);
          if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
            return parsed.href;
          }
        } catch {
          // ignore invalid URLs
        }
        return null;
      }

      function renderCitations(el, citations) {
        el.replaceChildren();
        for (const citation of citations || []) {
          const href = safeUrl(citation.url);
          if (!href) continue;
          const link = document.createElement('a');
          link.href = href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = citation.title || href;
          el.appendChild(link);
        }
      }

      function renderKpis(grid, account) {
        grid.replaceChildren();
        for (const [label, value] of [
          ['ARR', account.arr],
          ['Renewal', account.renewalDate],
          ['Risk', account.risk],
          ['Seats', account.seats],
          ['Owner', account.owner],
        ]) {
          const wrap = document.createElement('div');
          wrap.className = 'kpi';
          const dt = document.createElement('dt');
          dt.textContent = label;
          const dd = document.createElement('dd');
          dd.textContent = value ?? '';
          wrap.append(dt, dd);
          grid.appendChild(wrap);
        }
      }

      function renderTiles(container, tiles) {
        container.replaceChildren();
        for (const tile of tiles || []) {
          const article = document.createElement('article');
          article.className = 'card tile';
          const heading = document.createElement('h3');
          heading.textContent = tile.label;
          article.appendChild(heading);

          if (tile.empty || !tile.results?.length) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'No recent activity';
            article.appendChild(empty);
            container.appendChild(article);
            continue;
          }

          for (const hit of tile.results) {
            const hitEl = document.createElement('div');
            hitEl.className = 'hit';
            const href = safeUrl(hit.url);
            if (href) {
              const link = document.createElement('a');
              link.href = href;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = hit.title || href;
              hitEl.appendChild(link);
            } else {
              const title = document.createElement('strong');
              title.textContent = hit.title || 'Untitled';
              hitEl.appendChild(title);
            }
            const snippet = document.createElement('p');
            snippet.textContent = (hit.snippets || []).join(' ');
            hitEl.appendChild(snippet);
            article.appendChild(hitEl);
          }
          container.appendChild(article);
        }
      }

      function formatApiError(data) {
        return [data.error, data.hint].filter(Boolean).join(' — ');
      }

      async function postChat(question) {
        const response = await fetch('/api/brief', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await response.json();
        if (!response.ok)
          throw new Error(formatApiError(data) || response.statusText);
        return data;
      }

      async function loadAccount() {
        const response = await fetch('/api/account');
        const data = await response.json();
        if (!response.ok)
          throw new Error(formatApiError(data) || response.statusText);

        renderAccountIdentity(data.account);
        renderKpis(document.getElementById('kpi-grid'), data.account);
        document.getElementById('kpi-note').textContent = data.account.kpiNote;
        renderTiles(document.getElementById('tiles'), data.tiles);
      }

      async function runJourney(question) {
        const answerEl = document.getElementById('journey-answer');
        const errEl = document.getElementById('journey-error');
        errEl.hidden = true;
        answerEl.textContent = 'Thinking…';
        try {
          const result = await postChat(question);
          answerEl.textContent = result.answer || 'No answer returned.';
          renderCitations(
            document.getElementById('journey-citations'),
            result.citations,
          );
        } catch (error) {
          answerEl.textContent = '';
          errEl.hidden = false;
          errEl.textContent = error.message;
        }
      }

      async function runChat() {
        const input = document.getElementById('chat-input');
        const question = input.value.trim();
        if (!question) return;
        const answerEl = document.getElementById('chat-answer');
        const errEl = document.getElementById('chat-error');
        errEl.hidden = true;
        answerEl.textContent = 'Thinking…';
        try {
          const result = await postChat(question);
          answerEl.textContent = result.answer || 'No answer returned.';
          renderCitations(
            document.getElementById('chat-citations'),
            result.citations,
          );
        } catch (error) {
          answerEl.textContent = '';
          errEl.hidden = false;
          errEl.textContent = error.message;
        }
      }

      document.querySelectorAll('[data-prompt]').forEach((button) => {
        button.addEventListener('click', () =>
          runJourney(button.getAttribute('data-prompt')),
        );
      });
      document.getElementById('chat-send').addEventListener('click', runChat);
      document
        .getElementById('chat-input')
        .addEventListener('keydown', (event) => {
          if (event.key === 'Enter') runChat();
        });

      loadAccount()
        .then(() => runJourney('Customer summary for this account'))
        .catch((error) => {
          document.getElementById('journey-error').hidden = false;
          document.getElementById('journey-error').textContent = error.message;
        });

      // The account name is supplied by the server from GLEAN_ACCOUNT_NAME, so the
      // page never claims to be about an account it was not pointed at.
      function renderAccountIdentity(account) {
        const nameEl = document.querySelector('[data-account-name]');
        if (nameEl) nameEl.textContent = account.name ?? '';
        const subtitleEl = document.querySelector('[data-account-subtitle]');
        if (subtitleEl) {
          subtitleEl.textContent = [account.owner, account.name]
            .filter(Boolean)
            .join(' · ');
        }
      }
    </script>
  </body>
</html>
