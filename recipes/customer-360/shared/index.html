<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer 360</title>
    <style>
      :root {
        --primary: #3f36ed;
        --primary-hover: #3028c9;
        --primary-soft: #f0efff;
        --text-primary: #1d1f24;
        --text-secondary: #60646f;
        --text-muted: #858995;
        --background: #f6f7f9;
        --card: #ffffff;
        --border: #e3e5ea;
        --border-strong: #d4d7df;
        --error: #b42318;
        --error-soft: #fef3f2;
        --shadow: 0 8px 28px rgba(23, 24, 28, 0.06);
        --font:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--background);
        color: var(--text-primary);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      button,
      textarea {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        min-height: 64px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }

      .mark {
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
      }

      .brand-name {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .brand-context {
        overflow: hidden;
        margin-top: 2px;
        color: var(--text-secondary);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(350px, 410px);
        gap: 24px;
        align-items: stretch;
        width: min(1280px, calc(100% - 40px));
        margin: 20px auto 40px;
      }

      .main {
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-width: 0;
        min-height: 0;
      }

      .card {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      .overview {
        padding: 22px 24px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--primary);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .overview h1 {
        margin: 0;
        font-size: clamp(22px, 3vw, 30px);
        letter-spacing: -0.035em;
      }

      .overview-copy {
        margin: 7px 0 0;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.5;
      }

      .coverage {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 18px;
      }

      .coverage-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 30px;
        padding: 5px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fafafe;
        color: var(--text-secondary);
        font-size: 12px;
      }

      .coverage-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--primary);
      }

      .coverage-pill strong {
        color: var(--text-primary);
        font-weight: 700;
      }

      .overview-skeleton {
        width: 290px;
        max-width: 75%;
        height: 30px;
        border-radius: 8px;
        background: linear-gradient(90deg, #eef0f4, #f8f8fa, #eef0f4);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite linear;
      }

      .evidence {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
        padding: 22px 24px 24px;
      }

      .section-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .section-heading h2,
      .assistant-heading h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: -0.015em;
      }

      .section-heading p,
      .assistant-heading p {
        margin: 4px 0 0;
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.45;
      }

      .evidence-grid {
        display: grid;
        flex: 1 1 auto;
        grid-template-columns: minmax(0, 1fr);
        grid-auto-rows: 1fr;
        gap: 12px;
        min-height: 0;
      }

      .evidence-group {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fcfcfd;
      }

      .evidence-group-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 13px;
        border-bottom: 1px solid var(--border);
        background: #fff;
      }

      .evidence-group-header h3 {
        overflow: hidden;
        margin: 0;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .source-count {
        flex: 0 0 auto;
        color: var(--text-muted);
        font-size: 11px;
      }

      .source-list {
        display: grid;
        flex: 1 1 auto;
        min-height: 0;
      }

      .source {
        min-width: 0;
        padding: 12px 13px;
      }

      .source + .source {
        border-top: 1px solid var(--border);
      }

      .source a,
      .citation-chip {
        color: var(--primary);
        text-decoration: none;
      }

      .source a {
        display: -webkit-box;
        overflow: hidden;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .source a:hover,
      .citation-chip:hover {
        text-decoration: underline;
      }

      .source p {
        display: -webkit-box;
        overflow: hidden;
        margin: 6px 0 0;
        color: var(--text-secondary);
        font-size: 11px;
        line-height: 1.45;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .empty-evidence {
        margin: 12px;
        padding: 12px;
        border-radius: 9px;
        background: var(--primary-soft);
        color: var(--text-secondary);
        font-size: 12px;
        line-height: 1.45;
      }

      .assistant {
        position: sticky;
        top: 84px;
        display: flex;
        overflow: hidden;
        height: auto;
        min-height: calc(100vh - 108px);
        flex-direction: column;
      }

      .assistant-header {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
      }

      .assistant-avatar,
      .message-avatar {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-weight: 800;
      }

      .assistant-avatar {
        width: 34px;
        height: 34px;
        font-size: 15px;
      }

      .assistant-heading {
        min-width: 0;
      }

      .thread {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 18px;
        scroll-behavior: smooth;
        overscroll-behavior: contain;
      }

      .message {
        display: flex;
        gap: 9px;
        max-width: 100%;
        margin-bottom: 18px;
      }

      .message-avatar {
        width: 26px;
        height: 26px;
        margin-top: 2px;
        font-size: 11px;
      }

      .message-body {
        min-width: 0;
        max-width: calc(100% - 35px);
      }

      .message-label {
        margin-bottom: 5px;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .message-content {
        color: var(--text-primary);
        font-size: 13px;
        line-height: 1.58;
        overflow-wrap: anywhere;
      }

      .message-content > :first-child {
        margin-top: 0;
      }

      .message-content > :last-child {
        margin-bottom: 0;
      }

      .message-content h1,
      .message-content h2,
      .message-content h3 {
        margin: 16px 0 7px;
        font-size: 14px;
        line-height: 1.4;
      }

      .message-content p {
        margin: 0 0 10px;
      }

      .message-content ul {
        margin: 0 0 10px;
        padding-left: 18px;
      }

      .message-content li + li {
        margin-top: 5px;
      }

      .message-content a {
        color: var(--primary);
        text-underline-offset: 2px;
      }

      .message-user {
        justify-content: flex-end;
      }

      .message-user .message-body {
        max-width: 88%;
        padding: 9px 12px;
        border-radius: 13px 13px 3px 13px;
        background: var(--primary);
        color: #fff;
      }

      .message-user .message-content {
        color: inherit;
      }

      .message-error .message-body {
        padding: 10px 12px;
        border: 1px solid #fecdca;
        border-radius: 10px;
        background: var(--error-soft);
        color: var(--error);
      }

      .message-error .message-content {
        color: inherit;
      }

      .retry-button {
        margin-top: 8px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--error);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .citations {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }

      .citation-chip {
        display: inline-block;
        overflow: hidden;
        max-width: 100%;
        align-items: center;
        gap: 5px;
        padding: 5px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fafafe;
        font-size: 10px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .suggestions {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding: 10px 16px 2px;
        scrollbar-width: none;
      }

      .suggestions::-webkit-scrollbar {
        display: none;
      }

      .suggestion {
        flex: 0 0 auto;
        padding: 7px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        background: #fff;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 11px;
        white-space: nowrap;
      }

      .suggestion:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
      }

      .composer-wrap {
        border-top: 1px solid var(--border);
        background: #fff;
      }

      .composer {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        margin: 10px 12px 12px;
        padding: 7px 7px 7px 11px;
        border: 1px solid var(--border-strong);
        border-radius: 13px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(23, 24, 28, 0.04);
      }

      .composer:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }

      .composer textarea {
        width: 100%;
        min-height: 22px;
        max-height: 110px;
        resize: none;
        overflow-y: auto;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text-primary);
        font-size: 13px;
        line-height: 1.45;
      }

      .composer textarea::placeholder {
        color: var(--text-muted);
      }

      .send-button {
        display: inline-grid;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        place-items: center;
        border: 0;
        border-radius: 9px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
      }

      .send-button:hover:not(:disabled) {
        background: var(--primary-hover);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .thinking {
        display: inline-flex;
        gap: 4px;
        padding: 8px 0;
      }

      .thinking span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--text-muted);
        animation: pulse 1.1s infinite ease-in-out;
      }

      .thinking span:nth-child(2) {
        animation-delay: 0.14s;
      }

      .thinking span:nth-child(3) {
        animation-delay: 0.28s;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }

      @keyframes pulse {
        0%,
        70%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        35% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
          width: min(720px, calc(100% - 28px));
        }

        .assistant {
          position: static;
          min-height: min(680px, calc(100vh - 100px));
        }
      }

      @media (max-width: 680px) {
        .topbar {
          min-height: 58px;
          padding: 10px 15px;
        }

        .workspace,
        .main {
          gap: 10px;
        }

        .workspace {
          width: min(100% - 20px, 560px);
          margin-top: 10px;
        }

        .card {
          border-radius: 13px;
        }

        .overview,
        .evidence {
          padding: 18px;
        }

        .coverage {
          flex-wrap: nowrap;
          overflow-x: auto;
          margin-top: 14px;
          padding-bottom: 2px;
          scrollbar-width: none;
        }

        .coverage::-webkit-scrollbar {
          display: none;
        }

        .coverage-pill {
          flex: 0 0 auto;
        }

        .assistant {
          height: clamp(400px, calc(100vh - 290px), 520px);
          min-height: 0;
        }

        .thread {
          padding: 15px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg
          class="mark"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 32 32"
          role="img"
          aria-label="Glean"
        >
          <title>Glean</title>
          <path
            d="M24.3006 2.95427L20.7656 0.199951L17.9028 3.99527C13.5653 1.93495 8.23019 3.08439 5.19394 7.00983C1.65888 11.5642 2.483 18.1138 7.03738 21.6489C8.77238 22.9935 10.7893 23.7092 12.8279 23.8177C16.1461 24.0128 19.5077 22.6248 21.6765 19.8055C24.7344 15.88 24.5175 10.4148 21.4596 6.72789L24.3006 2.95427ZM18.1197 17.0512C16.1028 19.632 12.3725 20.1091 9.77001 18.0922C7.18919 16.0752 6.71207 12.3233 8.72901 9.74246C9.70494 8.48458 11.1146 7.68214 12.6761 7.48696C13.0448 7.44358 13.4135 7.4219 13.7822 7.44358C14.975 7.50865 16.1244 7.94239 17.0787 8.67977C19.6595 10.7184 20.1366 14.4703 18.1197 17.0512Z"
            fill="#4718F2"
          ></path>
          <path
            d="M24.5176 21.6922C23.932 22.4513 23.2814 23.1236 22.5657 23.7525C21.8717 24.3381 21.1127 24.8803 20.3102 25.3357C19.5295 25.7695 18.6837 26.1382 17.8378 26.4201C16.992 26.702 16.1028 26.8972 15.2137 27.0057C14.3245 27.1141 13.4353 27.1575 12.5244 27.0924C11.6135 27.0273 10.7243 26.8755 9.85684 26.6587L9.66165 27.3743L8.77246 30.9962C9.90021 31.2998 11.0497 31.4733 12.2208 31.56C12.2642 31.56 12.3292 31.56 12.3726 31.56C13.5003 31.6251 14.6498 31.5817 15.7558 31.4516C16.927 31.2998 18.0981 31.0395 19.2258 30.6708C20.3536 30.3022 21.4597 29.825 22.5007 29.2395C23.5634 28.6539 24.561 27.9382 25.4935 27.1575C26.4478 26.355 27.3153 25.4442 28.0744 24.4465C28.1828 24.3164 28.2695 24.1646 28.378 24.0128L24.7779 21.3452C24.6694 21.4537 24.6044 21.5838 24.5176 21.6922Z"
            fill="#4718F2"
          ></path>
        </svg>
        <div>
          <p class="brand-name">Customer 360</p>
          <div class="brand-context" data-account-subtitle>
            Account workspace
          </div>
        </div>
      </div>
    </header>

    <main class="workspace">
      <div class="main">
        <section class="card overview" aria-labelledby="account-title">
          <p class="eyebrow">Account workspace</p>
          <div class="overview-skeleton" id="account-skeleton"></div>
          <h1 id="account-title" data-account-name hidden></h1>
          <p class="overview-copy">
            Grounded in sources you already have permission to see. Unsupported
            account details stay out of the page.
          </p>
          <div
            class="coverage"
            id="coverage"
            aria-label="Evidence coverage"
          ></div>
        </section>

        <section class="card evidence" aria-labelledby="evidence-title">
          <div class="section-heading">
            <div>
              <h2 id="evidence-title">Supporting evidence</h2>
              <p>Permission-aware results retrieved for this account.</p>
            </div>
          </div>
          <div class="evidence-grid" id="evidence-grid"></div>
        </section>
      </div>

      <aside class="card assistant" aria-labelledby="assistant-title">
        <div class="assistant-header">
          <div class="assistant-avatar" aria-hidden="true">G</div>
          <div class="assistant-heading">
            <h2 id="assistant-title">Ask Glean</h2>
            <p>Answers are grounded in this account’s sources.</p>
          </div>
        </div>

        <div
          class="thread"
          id="thread"
          role="log"
          aria-live="polite"
          aria-relevant="additions"
        ></div>

        <div class="composer-wrap">
          <div class="suggestions" aria-label="Suggested questions">
            <button
              class="suggestion"
              type="button"
              data-prompt="Give me a customer summary"
            >
              Customer summary
            </button>
            <button
              class="suggestion"
              type="button"
              data-prompt="What are the renewal risks?"
            >
              Renewal risks
            </button>
            <button
              class="suggestion"
              type="button"
              data-prompt="What's the status of our renewal with that account?"
            >
              Renewal status
            </button>
          </div>
          <form class="composer" id="composer">
            <label class="visually-hidden" for="chat-input"
              >Ask about this account</label
            >
            <textarea
              id="chat-input"
              rows="1"
              placeholder="Ask about this account…"
              autocomplete="off"
            ></textarea>
            <button
              class="send-button"
              id="chat-send"
              type="submit"
              aria-label="Send message"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <path
                  d="M2 8h11M9 4l4 4-4 4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
            </button>
          </form>
        </div>
      </aside>
    </main>

    <script>
      const threadEl = document.getElementById('thread');
      const composerEl = document.getElementById('composer');
      const inputEl = document.getElementById('chat-input');
      const sendEl = document.getElementById('chat-send');
      const suggestionEls = Array.from(
        document.querySelectorAll('[data-prompt]'),
      );
      let requestInFlight = false;

      function safeUrl(url) {
        try {
          const parsed = new URL(url);
          if (parsed.protocol === 'http:' || parsed.protocol === 'https:')
            return parsed.href;
        } catch {
          // Ignore invalid and non-web URLs.
        }
        return null;
      }

      function normalizeMarkdown(text) {
        return String(text || '')
          .replace(/([^#\n])(?=#{1,3}\s)/g, '$1\n\n')
          .replace(/\r\n?/g, '\n')
          .trim();
      }

      function appendInlineMarkdown(parent, text) {
        const pattern = /(\*\*([^*]+)\*\*|\[([^\]]+)\]\(([^)]+)\))/g;
        let cursor = 0;
        for (const match of text.matchAll(pattern)) {
          if (match.index > cursor)
            parent.append(
              document.createTextNode(text.slice(cursor, match.index)),
            );
          if (match[2]) {
            const strong = document.createElement('strong');
            strong.textContent = match[2];
            parent.append(strong);
          } else {
            const href = safeUrl(match[4]);
            if (href) {
              const link = document.createElement('a');
              link.href = href;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = match[3];
              parent.append(link);
            } else {
              parent.append(document.createTextNode(match[3]));
            }
          }
          cursor = match.index + match[0].length;
        }
        if (cursor < text.length)
          parent.append(document.createTextNode(text.slice(cursor)));
      }

      function renderMarkdown(container, text) {
        const lines = normalizeMarkdown(text).split('\n');
        let list = null;
        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line) {
            list = null;
            continue;
          }

          const headingMatch = /^(#{1,3})\s+(.+)$/.exec(line);
          if (headingMatch) {
            list = null;
            const heading = document.createElement(
              `h${headingMatch[1].length}`,
            );
            appendInlineMarkdown(heading, headingMatch[2]);
            container.append(heading);
            continue;
          }

          const bulletMatch = /^[-*]\s+(.+)$/.exec(line);
          if (bulletMatch) {
            if (!list) {
              list = document.createElement('ul');
              container.append(list);
            }
            const item = document.createElement('li');
            appendInlineMarkdown(item, bulletMatch[1]);
            list.append(item);
            continue;
          }

          list = null;
          const paragraph = document.createElement('p');
          appendInlineMarkdown(paragraph, line);
          container.append(paragraph);
        }
      }

      function renderCitations(container, citations) {
        const valid = (citations || []).flatMap((citation, index) => {
          const href = safeUrl(citation.url);
          return href ? [{ ...citation, href, index }] : [];
        });
        if (!valid.length) return;

        const wrap = document.createElement('div');
        wrap.className = 'citations';
        wrap.setAttribute('aria-label', 'Sources');
        for (const citation of valid) {
          const link = document.createElement('a');
          link.className = 'citation-chip';
          link.href = citation.href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.title = citation.title || citation.href;
          link.textContent = `${citation.index + 1}. ${citation.title || 'Source'}`;
          wrap.append(link);
        }
        container.append(wrap);
      }

      function scrollToLatest() {
        requestAnimationFrame(() => {
          threadEl.scrollTop = threadEl.scrollHeight;
        });
      }

      function addUserMessage(text) {
        const message = document.createElement('article');
        message.className = 'message message-user';
        const body = document.createElement('div');
        body.className = 'message-body';
        const content = document.createElement('div');
        content.className = 'message-content';
        content.textContent = text;
        body.append(content);
        message.append(body);
        threadEl.append(message);
        scrollToLatest();
      }

      function addAssistantMessage(answer, citations, options = {}) {
        const message = document.createElement('article');
        message.className = 'message message-assistant';
        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.setAttribute('aria-hidden', 'true');
        avatar.textContent = 'G';
        const body = document.createElement('div');
        body.className = 'message-body';
        const label = document.createElement('div');
        label.className = 'message-label';
        label.textContent = 'Glean';
        const content = document.createElement('div');
        content.className = 'message-content';
        renderMarkdown(content, answer || 'No answer returned.');
        body.append(label, content);
        renderCitations(body, citations);
        message.append(avatar, body);
        threadEl.append(message);
        if (options.stickToTop) {
          requestAnimationFrame(() => {
            threadEl.scrollTop = 0;
          });
        } else {
          scrollToLatest();
        }
      }

      function addThinkingMessage() {
        const message = document.createElement('article');
        message.className = 'message message-assistant';
        message.setAttribute('aria-label', 'Glean is thinking');
        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.setAttribute('aria-hidden', 'true');
        avatar.textContent = 'G';
        const body = document.createElement('div');
        body.className = 'message-body';
        const thinking = document.createElement('div');
        thinking.className = 'thinking';
        thinking.append(
          document.createElement('span'),
          document.createElement('span'),
          document.createElement('span'),
        );
        body.append(thinking);
        message.append(avatar, body);
        threadEl.append(message);
        scrollToLatest();
        return message;
      }

      function addErrorMessage(error, question) {
        const message = document.createElement('article');
        message.className = 'message message-error';
        const body = document.createElement('div');
        body.className = 'message-body';
        const content = document.createElement('div');
        content.className = 'message-content';
        content.textContent =
          error.message || 'Could not answer that question.';
        const retry = document.createElement('button');
        retry.className = 'retry-button';
        retry.type = 'button';
        retry.textContent = 'Try again';
        retry.addEventListener('click', () => {
          message.remove();
          void askQuestion(question, { showUser: false });
        });
        body.append(content, retry);
        message.append(body);
        threadEl.append(message);
        scrollToLatest();
      }

      function setBusy(busy) {
        requestInFlight = busy;
        sendEl.disabled = busy;
        for (const button of suggestionEls) button.disabled = busy;
      }

      function resizeComposer() {
        inputEl.style.height = 'auto';
        inputEl.style.height = `${Math.min(inputEl.scrollHeight, 110)}px`;
      }

      function formatApiError(data) {
        return [data.error, data.hint].filter(Boolean).join(' — ');
      }

      async function postQuestion(question) {
        const response = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await response.json();
        if (!response.ok)
          throw new Error(formatApiError(data) || response.statusText);
        return data;
      }

      async function askQuestion(question, options = {}) {
        const normalized = String(question || '').trim();
        if (!normalized || requestInFlight) return;
        if (options.showUser !== false) addUserMessage(normalized);
        setBusy(true);
        const thinking = addThinkingMessage();
        try {
          const result = await postQuestion(normalized);
          thinking.remove();
          addAssistantMessage(result.answer, result.citations, {
            stickToTop: options.initial === true,
          });
        } catch (error) {
          thinking.remove();
          addErrorMessage(error, normalized);
        } finally {
          setBusy(false);
          inputEl.focus();
        }
      }

      function renderCoverage(tiles) {
        const coverageEl = document.getElementById('coverage');
        coverageEl.replaceChildren();
        const total = (tiles || []).reduce(
          (sum, tile) => sum + (tile.results?.length || 0),
          0,
        );
        const metrics = [
          ['Sources', total],
          ...(tiles || []).map((tile) => [
            tile.label,
            tile.results?.length || 0,
          ]),
        ];
        for (const [label, value] of metrics) {
          const pill = document.createElement('span');
          pill.className = 'coverage-pill';
          const dot = document.createElement('span');
          dot.className = 'coverage-dot';
          dot.setAttribute('aria-hidden', 'true');
          const count = document.createElement('strong');
          count.textContent = String(value);
          pill.append(dot, count, document.createTextNode(label));
          coverageEl.append(pill);
        }
      }

      function renderEvidence(tiles) {
        const grid = document.getElementById('evidence-grid');
        grid.replaceChildren();
        for (const tile of tiles || []) {
          const group = document.createElement('article');
          group.className = 'evidence-group';
          const header = document.createElement('div');
          header.className = 'evidence-group-header';
          const heading = document.createElement('h3');
          heading.textContent = tile.label;
          const count = document.createElement('span');
          count.className = 'source-count';
          const resultCount = tile.results?.length || 0;
          count.textContent = `${resultCount} source${resultCount === 1 ? '' : 's'}`;
          header.append(heading, count);
          group.append(header);

          if (tile.empty || !resultCount) {
            const empty = document.createElement('div');
            empty.className = 'empty-evidence';
            empty.textContent = 'No matching evidence found.';
            group.append(empty);
            grid.append(group);
            continue;
          }

          const list = document.createElement('div');
          list.className = 'source-list';
          for (const hit of tile.results) {
            const source = document.createElement('div');
            source.className = 'source';
            const href = safeUrl(hit.url);
            if (href) {
              const link = document.createElement('a');
              link.href = href;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = hit.title || href;
              source.append(link);
            } else {
              const title = document.createElement('strong');
              title.textContent = hit.title || 'Untitled';
              source.append(title);
            }
            const snippetText = (hit.snippets || []).join(' ').trim();
            if (snippetText) {
              const snippet = document.createElement('p');
              snippet.textContent = snippetText;
              source.append(snippet);
            }
            list.append(source);
          }
          group.append(list);
          grid.append(group);
        }
      }

      function renderAccountIdentity(account) {
        document.getElementById('account-skeleton').hidden = true;
        const nameEl = document.querySelector('[data-account-name]');
        nameEl.hidden = false;
        nameEl.textContent = account.name || 'Account';
        const subtitleEl = document.querySelector('[data-account-subtitle]');
        subtitleEl.textContent = account.name || 'Account workspace';
        document.title = `${account.name || 'Account'} · Customer 360`;
      }

      async function loadAccount() {
        const response = await fetch('/api/account');
        const data = await response.json();
        if (!response.ok)
          throw new Error(formatApiError(data) || response.statusText);
        renderAccountIdentity(data.account);
        renderCoverage(data.tiles);
        renderEvidence(data.tiles);
      }

      composerEl.addEventListener('submit', (event) => {
        event.preventDefault();
        const question = inputEl.value.trim();
        if (!question) return;
        inputEl.value = '';
        resizeComposer();
        void askQuestion(question);
      });

      inputEl.addEventListener('input', resizeComposer);
      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          composerEl.requestSubmit();
        }
      });

      for (const button of suggestionEls) {
        button.addEventListener(
          'click',
          () => void askQuestion(button.dataset.prompt),
        );
      }

      loadAccount()
        .then(() =>
          askQuestion('Give me a customer summary', {
            showUser: false,
            initial: true,
          }),
        )
        .catch((error) => {
          document.getElementById('account-skeleton').hidden = true;
          document.querySelector('[data-account-name]').hidden = false;
          document.querySelector('[data-account-name]').textContent =
            'Could not load account';
          addErrorMessage(error, 'Give me a customer summary');
        });
    </script>
  </body>
</html>
